name: Build parking fix APK

on:
  push:
    branches: [fix/parking-scan-recovery]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hassble-parking-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
