name: Build HA Gateway Restart APK

on:
  push:
    branches: [feat/ha-gateway-controls-v174]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Apply HA gateway restart patch
        run: python tools/apply_gateway_restart_button.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/HassBle-v1.7.4-ha-gateway-restart-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hassble-v1.7.4-ha-gateway-restart-debug-apk
          path: dist/HassBle-v1.7.4-ha-gateway-restart-debug.apk
          retention-days: 30
