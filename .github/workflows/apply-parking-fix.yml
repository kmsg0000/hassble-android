name: Apply parking scan recovery patch

on:
  push:
    branches: [fix/parking-scan-recovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/parking-scan-recovery

      - name: Apply targeted source patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          runtime = "app/src/main/java/dev/eigger/hassble/ble/BleRuntime.kt"
          ws = "app/src/main/java/dev/eigger/hassble/net/HaWsClient.kt"

          replace_once(
              runtime,
              "import kotlinx.coroutines.sync.withLock\nimport kotlinx.serialization.json.Json\n",
              "import kotlinx.coroutines.sync.withLock\nimport kotlinx.coroutines.withTimeoutOrNull\nimport kotlinx.serialization.json.Json\n",
          )

          replace_once(
              runtime,
              "    private val scanLifecycleMutex = Mutex()\n",
              "    private val scanLifecycleMutex = Mutex()\n"
              "    // Request/response advertisement profiles (for example MyTown parking) can hit an Android BLE\n"
              "    // scanner state where the scan Flow is still alive but the expected response is no longer delivered.\n"
              "    // A short, rate-limited scan refresh before the request mirrors the manual gateway restart that\n"
              "    // recovers the device, without restarting the whole foreground service.\n"
              "    private val requestScanRefreshJobs = java.util.concurrent.ConcurrentHashMap<String, Job>()\n"
              "    private val lastRequestScanRefreshMs = java.util.concurrent.ConcurrentHashMap<String, Long>()\n",
          )

          replace_once(
              runtime,
              '                    "press", "turn_on" -> startAdvertise(d)\n',
              '                    "press", "turn_on" -> startAdvertiseForRequest(d)\n',
          )

          marker = "    private fun startAdvertise(d: DeviceConfig) {\n"
          helper = '''    private fun startAdvertiseForRequest(d: DeviceConfig) {\n        val needsResponse = d.source == Source.advertisement && d.advertise?.stopOnResponse == true\n        if (!needsResponse) {\n            startAdvertise(d)\n            return\n        }\n\n        // If a refresh is already in progress, preserve this button press but wait until the new scan\n        // session is ready before transmitting. This prevents repeated HA presses from racing startScan().\n        requestScanRefreshJobs[d.id]?.takeIf { it.isActive }?.let { inFlight ->\n            scope.launch {\n                inFlight.join()\n                if (!stopped) startAdvertise(d)\n            }\n            return\n        }\n\n        val now = System.currentTimeMillis()\n        val lastRefresh = lastRequestScanRefreshMs[d.id] ?: 0L\n        if (now - lastRefresh < REQUEST_SCAN_REFRESH_COOLDOWN_MS) {\n            startAdvertise(d)\n            return\n        }\n\n        lastRequestScanRefreshMs[d.id] = now\n        val beforeSession = BleScanHealth.state.value.sessionCount\n        val job = scope.launch {\n            LiveEventLogger.log(LogType.LINK,\n                "device=${d.id}: refreshing BLE scan before request/response advertisement")\n\n            scanLifecycleMutex.withLock {\n                scanJob?.cancelAndJoin()\n                scanJob = null\n                scanner.stop()\n                if (stopped) return@withLock\n                launchScan()\n            }\n\n            val ready = withTimeoutOrNull(REQUEST_SCAN_READY_TIMEOUT_MS) {\n                BleScanHealth.state.first { health ->\n                    health.scanning && health.sessionCount > beforeSession\n                }\n            } != null\n\n            if (ready) {\n                LiveEventLogger.log(LogType.LINK,\n                    "device=${d.id}: BLE scan refresh ready — sending advertisement request")\n            } else {\n                LiveEventLogger.log(LogType.LINK,\n                    "[Warning] device=${d.id}: BLE scan refresh did not report ready within " +\n                        "${REQUEST_SCAN_READY_TIMEOUT_MS / 1000}s — sending request anyway")\n            }\n            if (!stopped) startAdvertise(d)\n        }\n        requestScanRefreshJobs[d.id] = job\n        job.invokeOnCompletion { requestScanRefreshJobs.remove(d.id, job) }\n    }\n\n'''
          replace_once(runtime, marker, helper + marker)

          replace_once(
              runtime,
              "        pendingHaCleanupIds.clear()\n        lastConfig = null\n",
              "        requestScanRefreshJobs.values.forEach { it.cancel() }\n"
              "        requestScanRefreshJobs.clear()\n"
              "        lastRequestScanRefreshMs.clear()\n"
              "        pendingHaCleanupIds.clear()\n        lastConfig = null\n",
          )

          replace_once(
              runtime,
              "        startAdvertise(d)\n    }\n\n    /** 게이트웨이 실행 중 특정 기기의 BLE 광고 송신을 중단. */\n",
              "        startAdvertiseForRequest(d)\n    }\n\n    /** 게이트웨이 실행 중 특정 기기의 BLE 광고 송신을 중단. */\n",
          )

          replace_once(
              runtime,
              "        private const val COLLECTOR_RELAUNCH_DELAY_MS = 5_000L\n",
              "        private const val COLLECTOR_RELAUNCH_DELAY_MS = 5_000L\n"
              "        private const val REQUEST_SCAN_REFRESH_COOLDOWN_MS = 15_000L\n"
              "        private const val REQUEST_SCAN_READY_TIMEOUT_MS = 5_000L\n",
          )

          old_flush = '''    private fun flushPendingMessages() {\n        pendingMessages.withLock {\n            val queued = pendingMessages.drain()\n            if (queued.isNotEmpty()) {\n                LiveEventLogger.log(LogType.LINK, "WS: flushing ${queued.size} queued message(s) after (re)connect")\n            }\n            for (text in queued) send(text)\n        }\n    }\n'''
          new_flush = '''    private fun flushPendingMessages() {\n        pendingMessages.withLock {\n            val queued = pendingMessages.drain()\n            if (queued.isNotEmpty()) {\n                LiveEventLogger.log(LogType.LINK, "WS: flushing ${queued.size} queued message(s) after (re)connect with fresh ids")\n            }\n            for (text in queued) send(reassignQueuedMessageId(text))\n        }\n    }\n\n    /**\n     * Messages queued before ws_bridge/connect already have ids smaller than the connect message id.\n     * The bridge requires monotonically increasing identifiers on one WebSocket, so replaying those\n     * original ids causes `id_reuse: Identifier values have to increase`. Allocate a fresh id at\n     * flush time and move any request waiter to the replacement id.\n     */\n    private fun reassignQueuedMessageId(text: String): String {\n        return try {\n            val obj = json.parseToJsonElement(text).jsonObject\n            val oldId = obj["id"]?.jsonPrimitive?.content?.toIntOrNull() ?: return text\n            val newId = idGen.getAndIncrement()\n            pendingRequests.remove(oldId)?.let { pendingRequests[newId] = it }\n            JsonObject(obj.toMutableMap().apply { put("id", JsonPrimitive(newId)) }).toString()\n        } catch (e: Exception) {\n            LiveEventLogger.log(LogType.LINK,\n                "[Warning] WS: could not reassign queued message id (${e.localizedMessage}); sending original")\n            text\n        }\n    }\n'''
          replace_once(ws, old_flush, new_flush)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Verify build and tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/eigger/hassble/ble/BleRuntime.kt app/src/main/java/dev/eigger/hassble/net/HaWsClient.kt
          git commit -m "fix: refresh BLE scan for request-response advertising" || exit 0
          git push origin HEAD:fix/parking-scan-recovery
