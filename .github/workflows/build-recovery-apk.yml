name: Build HassBle recovery APK
on:
  push:
    branches:
      - fix/parking-ble-diagnostics-1.8.9
  pull_request:
    branches:
      - chatgpt/gateway-controls-1.7.7
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hassble-1.8.9-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
